name: batack-backend

services:
  db:
    image: postgres:16-alpine
    container_name: batack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-batack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini}
      POSTGRES_DB: ${POSTGRES_DB:-batack}
    volumes:
      - batack_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batack} -d ${POSTGRES_DB:-batack}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: batack_redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD doit être défini}
    volumes:
      - batack_redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/connectbatack/backend-cb3:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batack_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-batack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-batack}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_DIR: /app/storage
    volumes:
      # Persistance locale des photos, justificatifs et documents
      - ./storage:/app/storage
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: batack_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8085}:80"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/modes:/etc/nginx/modes:ro
      - ./nginx/30-configure-ssl.sh:/docker-entrypoint.d/30-configure-ssl.sh:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  batack_pgdata:
  batack_redisdata:
