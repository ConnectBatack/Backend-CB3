[project]
name = "connectbatack3-backend"
version = "1.0.0"
description = "Backend FastAPI complet pour la plateforme ConnectBatack 3 (dons, transparence, registre financier, AHP, planification MILP, gestion des médias)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

