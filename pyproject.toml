[project]
name = "batack-backend"
version = "1.0.0"
description = "Backend FastAPI pour la plateforme Batack (dons, transparence, registre financier, AHP, planification MILP, gestion des médias)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
